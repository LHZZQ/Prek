name: Continuous Integration - Flutter

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup and Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # open the cache
      - name: Create .env for CI
        working-directory: prek-app
        shell: bash
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          test -s .env && echo ".env created (size: $(wc -c < .env) bytes)"

      - name: Install Flutter Dependencies
        working-directory: ./prek-app
        run: flutter pub get

      - name: Static Analysis (flutter analyze)
        working-directory: ./prek-app
        run: flutter analyze

      - name: Run Tests
        working-directory: ./prek-app
        run: flutter test
