name: Continuous Integration - Flutter

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup and Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # open the cache

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Static Analysis (flutter analyze)
        run: flutter analyze

      - name: Run Tests
        run: flutter test
