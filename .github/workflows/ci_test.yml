name: CI tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pull the code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Setup and Install Flutter SDK
      - name: Setup and Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # open the cache

      # Create .env file for CI from secrets
      - name: Create .env for CI
        working-directory: prek-app
        shell: bash
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          test -s .env && echo ".env created (size: $(wc -c < .env) bytes)"

      # Install Flutter Dependencies
      - name: Install Flutter Dependencies
        working-directory: ./prek-app
        run: flutter pub get

      # Format check
      - name: Dart format check
        working-directory: ./prek-app
        run: |
          echo "Checking Dart formatting..."
          dart format --set-exit-if-changed . || (
            echo "::error title=Format check failed::Code is not formatted. Run 'dart format .' locally."
            exit 1
          )

      # Static Analysis
      - name: Static Analysis (flutter analyze)
        working-directory: ./prek-app
        run: |
          echo "Running Flutter static analysis..."
          flutter analyze || (
            echo "::error title=Lint failed::Flutter analyze found issues. Please fix lint errors before merging."
            exit 1
          )

      # Run Tests with Coverage
      - name: Run Tests with Coverage
        working-directory: ./prek-app
        run: flutter test --coverage

      # Upload Coverage Artifact
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: ./prek-app/coverage/lcov.info

      - name: Supabase CLI
        run: npx supabase --version

  backend_migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'

      - name: Supabase CLI
        if: steps.filter.outputs.supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.76.7
      
      - name: Docker sanity check
        if: steps.filter.outputs.supabase == 'true'
        run: |
          docker version
          docker ps

      - name: Start local Supabase
        if: steps.filter.outputs.supabase == 'true'
        run: supabase start

      - name: Apply migrations
        if: steps.filter.outputs.supabase == 'true'
        run: supabase db reset

      - name: Check schema drift
        if: steps.filter.outputs.supabase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db diff --use-migra -f /tmp/schema_diff.sql
          # generate the temp file
          if [ -s /tmp/schema_diff.sql ]; then
            echo "::error title=Schema drift detected::Database schema differs from migrations. Run 'supabase db diff -f supabase/migrations/<timestamp>_drift.sql' and commit the migration."
            echo "----- diff preview (first 200 lines) -----"
            sed -n '1,200p' /tmp/schema_diff.sql || true
            exit 1
          fi

          echo "No schema drift detected."
      
      - name: Stop local Supabase
        if: always() && steps.filter.outputs.supabase == 'true'
        run: supabase stop

      - name: Skip note
        if: steps.filter.outputs.supabase != 'true'
        run: echo "No supabase/** changes detected. Skipping backend_migrations."
