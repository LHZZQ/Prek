name: CD tests

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prek-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Pub cache
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('prek-app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('prek-app/android/**/*.gradle*', 'prek-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache Android SDK
      - name: Cache Android SDK (CMake)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-androidsdk-${{ hashFiles('prek-app/android/**/*.gradle*', 'prek-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-androidsdk-

      - name: Install deps
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests (with coverage)
        run: flutter test --coverage

      # Build Web release
      - name: Build Web (release)
        run: flutter build web --release

      # Detect whether Android-related files changed
      - name: Detect Android-related changes
        id: android_changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(prek-app/lib/|prek-app/android/|prek-app/pubspec.yaml|prek-app/pubspec.lock)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Only on PR & only when relevant files changed
      - name: Build Android (debug)
        if: github.event_name == 'pull_request' && steps.android_changes.outputs.changed == 'true'
        run: flutter build apk --debug

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: prek-app/coverage/lcov.info
          if-no-files-found: ignore


  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: prek-app

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('prek-app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install deps
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --no-codesign
